  { key: "god", label: "Time with God" },
  { key: "body", label: "Steward My Body" },
  { key: "mission", label: "Build the Mission" },
  { key: "wife", label: "Love My Wife" },
  { key: "children", label: "Lead My Children" },
  { key: "obedience", label: "Walk in Obedience" },
];

function emptyDay() {
  return {
    reflect: ["", ""],
    actionDone: false,
    scorecard: { god: false, body: false, mission: false, wife: false, children: false, obedience: false },
    noticedGod: "",
    correction: "",
  };
}

function scoreOf(entry) {
  if (!entry) return 0;
  return SCORE_FIELDS.reduce((n, f) => n + (entry.scorecard?.[f.key] ? 1 : 0), 0);
}

const COLORS = {
  ink: "#14171C",
  inkRaised: "#1B1F26",
  inkLine: "#2A303A",
  parchment: "#F2ECDD",
  parchmentText: "#241F16",
  brass: "#B4894F",
  brassBright: "#D2AA6D",
  slate: "#8891A0",
  slateDim: "#565E6B",
  faithful: "#5C8368",
};

function todayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

const TRACKING_START_KEY = "faithful90:trackingStart";
function getTrackingStart() {
  let v = localStorage.getItem(TRACKING_START_KEY);
  if (!v) {
    v = todayKey();
    localStorage.setItem(TRACKING_START_KEY, v);
  }
  return v;
}

function App() {
  const [progress, setProgress] = useState({});
  const [activity, setActivity] = useState({});
  const [trackingStart] = useState(getTrackingStart);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("dashboard");
  const [activeDay, setActiveDay] = useState(1);
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const progressRef = useRef({});
  const activityRef = useRef({});

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setProgress(parsed);
          progressRef.current = parsed;
        }
      } catch (e) {}
      try {
        const actRes = await storage.get(ACTIVITY_KEY);
        if (actRes && actRes.value) {
          const parsedAct = JSON.parse(actRes.value);
          setActivity(parsedAct);
          activityRef.current = parsedAct;
        }
      } catch (e) {}
      finally { setLoaded(true); }
    })();
  }, []);

  const markToday = useCallback(() => {
    const key = todayKey();
    if (activityRef.current[key]) return;
    const next = { ...activityRef.current, [key]: true };
    activityRef.current = next;
    setActivity(next);
    storage.set(JSON.stringify(next), ACTIVITY_KEY).catch(() => {});
  }, []);

  const persist = useCallback((next) => {
    progressRef.current = next;
    setProgress(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveState("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set(JSON.stringify(next), STORAGE_KEY);
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1200);
      } catch (e) { setSaveState("idle"); }
    }, 400);
  }, []);

  const updateDay = (dayNum, patch) => {
    const current = progressRef.current[dayNum] || emptyDay();
    const next = { ...progressRef.current, [dayNum]: { ...current, ...patch } };
    persist(next);
    markToday();
  };

  const toggleScore = (dayNum, key) => {
    const current = progressRef.current[dayNum] || emptyDay();
    const next = {
      ...progressRef.current,
      [dayNum]: { ...current, scorecard: { ...current.scorecard, [key]: !current.scorecard[key] } },
    };
    persist(next);
    markToday();
  };

  const completedDays = new Set(
    Object.keys(progressRef.current).map(Number).filter((d) => scoreOf(progressRef.current[d]) === 6)
  );
  let currentStreak = 0;
  for (let d = 1; d <= 90; d++) { if (completedDays.has(d)) currentStreak++; else break; }
  const totalComplete = completedDays.size;
  const overallPercent = Math.round((totalComplete / 90) * 100);
  const nextDay = Math.min(currentStreak + 1, 90);

  const openDay = (d) => { setActiveDay(d); setView("day"); };

  if (!loaded) {
    return (
      <div style={{ background: COLORS.ink, minHeight: "100vh" }} className="flex items-center justify-center">
        <p style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="text-base tracking-widest">OPENING LEDGER…</p>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.ink, minHeight: "100vh", fontFamily: "'Inter', sans-serif" }}>
      {view === "dashboard" ? (
        <Dashboard progress={progress} activity={activity} trackingStart={trackingStart} currentStreak={currentStreak} totalComplete={totalComplete} overallPercent={overallPercent} nextDay={nextDay} openDay={openDay} />
      ) : (
        <DayView dayNum={activeDay} entry={progress[activeDay] || emptyDay()} setView={setView} setActiveDay={setActiveDay} updateDay={updateDay} toggleScore={toggleScore} saveState={saveState} />
      )}
    </div>
  );
}

function Dashboard({ progress, activity, trackingStart, currentStreak, totalComplete, overallPercent, nextDay, openDay }) {
  return (
    <div className="max-w-3xl mx-auto px-5 pb-24 pt-10 md:pt-16">
      <header className="mb-10 text-center">
        <p style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: "0.3em" }} className="text-[13px] mb-3 uppercase">A Stewardship Ledger</p>
        <h1 style={{ color: COLORS.parchment, fontFamily: "'Source Serif 4', serif" }} className="text-6xl md:text-7xl font-semibold tracking-tight">FAITHFUL</h1>
        <p style={{ color: COLORS.slate }} className="mt-3 text-base max-w-md mx-auto leading-relaxed">"Well done, good and faithful servant." — Matthew 25:21</p>
      </header>

      <div style={{ background: COLORS.inkRaised, border: `1px solid ${COLORS.inkLine}` }} className="rounded-lg grid grid-cols-3 divide-x mb-6">
        <Stat icon={<Flame size={16} style={{ color: COLORS.brass }} />} value={currentStreak} label="Day streak" />
        <Stat value={`${totalComplete}/90`} label="Days complete" />
        <Stat value={`${overallPercent}%`} label="Faithfulness" />
      </div>

      <ActivityStrip activity={activity} trackingStart={trackingStart} />

      <HabitBreakdown progress={progress} />

      <button onClick={() => openDay(nextDay)} style={{ background: COLORS.brass, color: COLORS.ink }} className="w-full rounded-lg py-3.5 mb-10 font-semibold text-base flex items-center justify-center gap-2 hover:opacity-90 transition">
        {totalComplete >= 90 ? "Review Day 90" : `Continue — Day ${nextDay}`}
        <ChevronRight size={16} />
      </button>

      <div className="space-y-6">
        {WEEKS.map((w) => <WeekRow key={w.week} week={w} progress={progress} nextDay={nextDay} openDay={openDay} />)}
      </div>

      <p style={{ color: COLORS.slateDim }} className="text-center text-sm mt-12 leading-relaxed">
        One miss never becomes permission to abandon the day.<br />Return at the next available decision.
      </p>
    </div>
  );
}

function HabitBreakdown({ progress }) {
  const entries = Object.values(progress);
  const totalDays = entries.length;
  if (totalDays === 0) return null;

  const stats = SCORE_FIELDS.map((f) => {
    const count = entries.filter((e) => e.scorecard?.[f.key]).length;
    return { ...f, pct: Math.round((count / totalDays) * 100) };
  }).sort((a, b) => b.pct - a.pct);

  return (
    <div className="mb-8">
      <h2 style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm uppercase tracking-widest mb-3">
        Habit Breakdown
      </h2>
      <div style={{ background: COLORS.inkRaised, border: `1px solid ${COLORS.inkLine}` }} className="rounded-lg p-4 space-y-3.5">
        {stats.map((s, i) => {
          const isLeading = i === 0 && s.pct > 0;
          const isLagging = i === stats.length - 1 && s.pct < 100;
          const barColor = isLeading ? COLORS.faithful : isLagging ? "#A15C4A" : COLORS.brass;
          return (
            <div key={s.key}>
              <div className="flex items-center justify-between mb-1">
                <span style={{ color: COLORS.parchment }} className="text-sm">
                  {s.label}
                  {isLeading && <span style={{ color: COLORS.faithful }} className="ml-2 text-[11px] uppercase tracking-wider">Leading</span>}
                  {isLagging && <span style={{ color: "#C08469" }} className="ml-2 text-[11px] uppercase tracking-wider">Lagging</span>}
                </span>
                <span style={{ color: COLORS.slate, fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm">{s.pct}%</span>
              </div>
              <div style={{ background: COLORS.inkLine }} className="h-1.5 rounded-full overflow-hidden">
                <div style={{ width: `${s.pct}%`, background: barColor }} className="h-full rounded-full transition-all" />
              </div>
            </div>
          );
        })}
      </div>
      <p style={{ color: COLORS.slateDim }} className="text-[13px] mt-2">
        Based on {totalDays} day{totalDays === 1 ? "" : "s"} logged.
      </p>
    </div>
  );
}

function ActivityStrip({ activity, trackingStart }) {
  const cells = [];
  const today = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    cells.push({
      key,
      label: d.getDate(),
      weekday: "SMTWTFS"[d.getDay()],
      isToday: i === 0,
      done: !!activity[key],
      tracked: key >= trackingStart,
    });
  }
  const missedCount = cells.filter((c) => !c.isToday && !c.done && c.tracked).length;

  return (
    <div className="mb-8">
      <div className="flex items-center justify-between mb-2 px-0.5">
        <h2 style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm uppercase tracking-widest">
          Last 14 Days
        </h2>
        {missedCount > 0 && (
          <span style={{ color: "#C08469", fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm">
            {missedCount} missed
          </span>
        )}
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {cells.map((c) => {
          const state = c.done ? "done" : c.isToday ? "today" : !c.tracked ? "untracked" : "missed";
          const styles = {
            done: { background: "rgba(180,137,79,0.22)", border: `1px solid ${COLORS.brass}`, color: COLORS.brassBright },
            today: { background: COLORS.inkRaised, border: `1px dashed ${COLORS.brassBright}`, color: COLORS.slate },
            untracked: { background: COLORS.inkRaised, border: `1px solid ${COLORS.inkLine}`, color: COLORS.slateDim },
            missed: { background: "rgba(161,92,74,0.10)", border: "1px solid rgba(161,92,74,0.45)", color: "#C08469" },
          }[state];
          const titleText = c.done ? `${c.key} — logged` : c.isToday ? `${c.key} — today` : !c.tracked ? `${c.key} — before tracking started` : `${c.key} — missed`;
          return (
            <div
              key={c.key}
              title={titleText}
              style={{ ...styles, fontFamily: "'IBM Plex Mono', monospace", opacity: state === "untracked" ? 0.5 : 1 }}
              className="aspect-square rounded-[3px] flex flex-col items-center justify-center"
            >
              <span className="text-[10px] opacity-60">{c.weekday}</span>
              <span className="text-sm leading-none mt-0.5">{c.label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Stat({ icon, value, label }) {
  return (
    <div className="flex flex-col items-center justify-center py-4">
      <div style={{ color: COLORS.parchment, fontFamily: "'IBM Plex Mono', monospace" }} className="text-2xl font-semibold flex items-center gap-1.5">{icon}{value}</div>
      <div style={{ color: COLORS.slate }} className="text-[12px] uppercase tracking-wider mt-1">{label}</div>
    </div>
  );
}

function WeekRow({ week, progress, nextDay, openDay }) {
  const daysInWeek = DAYS.filter((d) => d.week === week.week);
  return (
    <div>
      <div className="flex items-baseline justify-between mb-2 px-0.5">
        <h2 style={{ color: COLORS.parchment, fontFamily: "'Source Serif 4', serif" }} className="text-base font-semibold">
          <span style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="mr-2 text-sm">{String(week.week).padStart(2, "0")}</span>
          {week.title}
        </h2>
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {daysInWeek.map((d) => {
          const entry = progress[d.day];
          const score = scoreOf(entry);
          const isNext = d.day === nextDay;
          const opacity = score === 0 ? 0.08 : 0.25 + (score / 6) * 0.75;
          return (
            <button key={d.day} onClick={() => openDay(d.day)} title={`Day ${d.day} — ${d.title}`}
              style={{ background: score > 0 ? `rgba(180,137,79,${opacity})` : COLORS.inkRaised, border: isNext ? `1px solid ${COLORS.brassBright}` : `1px solid ${COLORS.inkLine}`, color: score >= 4 ? COLORS.ink : COLORS.slate, fontFamily: "'IBM Plex Mono', monospace" }}
              className="aspect-square rounded-[3px] text-[12px] flex items-center justify-center hover:brightness-110 transition">
              {d.day}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DayView({ dayNum, entry, setView, setActiveDay, updateDay, toggleScore, saveState }) {
  const day = DAYS[dayNum - 1];
  const [r1, setR1] = useState(entry.reflect?.[0] || "");
  const [r2, setR2] = useState(entry.reflect?.[1] || "");
  const [notice, setNotice] = useState(entry.noticedGod || "");
  const [correction, setCorrection] = useState(entry.correction || "");

  useEffect(() => {
    setR1(entry.reflect?.[0] || "");
    setR2(entry.reflect?.[1] || "");
    setNotice(entry.noticedGod || "");
    setCorrection(entry.correction || "");
  }, [dayNum]);

  const goTo = (n) => { if (n < 1 || n > 90) return; setActiveDay(n); };

  return (
    <div className="max-w-2xl mx-auto px-5 pb-28 pt-8 md:pt-10">
      <div className="flex items-center justify-between mb-6">
        <button onClick={() => setView("dashboard")} style={{ color: COLORS.slate }} className="flex items-center gap-1 text-sm hover:text-white transition">
          <ChevronLeft size={14} /> Ledger
        </button>
        <div style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[13px] tracking-wider">WEEK {String(day.week).padStart(2, "0")} · DAY {String(dayNum).padStart(2, "0")} / 90</div>
      </div>

      <h1 style={{ color: COLORS.parchment, fontFamily: "'Source Serif 4', serif" }} className="text-4xl md:text-5xl font-semibold leading-tight mb-4">{day.title}</h1>

      <div style={{ background: COLORS.inkRaised, border: `1px solid ${COLORS.inkLine}`, color: COLORS.slate }} className="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-sm mb-6">
        <BookOpen size={13} style={{ color: COLORS.brass }} /> Read: {day.read}
      </div>

      <div style={{ borderLeft: `3px solid ${COLORS.brass}`, color: COLORS.brassBright, fontFamily: "'Source Serif 4', serif" }} className="pl-4 py-1 mb-6 text-xl italic leading-snug">{day.keyTruth}</div>

      <p style={{ color: "#C9CDD4" }} className="text-[17px] leading-relaxed mb-10">{day.body}</p>

      <Section title="Reflect">
        <ReflectField label={day.reflect[0]} value={r1} onChange={(v) => { setR1(v); updateDay(dayNum, { reflect: [v, r2] }); }} />
        <ReflectField label={day.reflect[1]} value={r2} onChange={(v) => { setR2(v); updateDay(dayNum, { reflect: [r1, v] }); }} />
      </Section>

      <Section title="Pray">
        <p style={{ color: "#C9CDD4", fontFamily: "'Source Serif 4', serif" }} className="text-[17px] italic leading-relaxed">{day.pray}</p>
      </Section>

      <Section title="Today's Obedience Action">
        <button onClick={() => updateDay(dayNum, { actionDone: !entry.actionDone })}
          style={{ background: entry.actionDone ? "rgba(92,131,104,0.15)" : COLORS.inkRaised, border: `1px solid ${entry.actionDone ? COLORS.faithful : COLORS.inkLine}` }}
          className="w-full flex items-start gap-3 rounded-lg p-4 text-left transition">
          <span style={{ background: entry.actionDone ? COLORS.faithful : "transparent", border: `1.5px solid ${entry.actionDone ? COLORS.faithful : COLORS.slate}` }} className="mt-0.5 shrink-0 w-4 h-4 rounded-full flex items-center justify-center">
            {entry.actionDone && <Check size={11} color={COLORS.ink} strokeWidth={3} />}
          </span>
          <span style={{ color: COLORS.parchment }} className="text-base leading-relaxed">{day.action}</span>
        </button>
      </Section>

      <Section title="Evening Scorecard">
        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
          {SCORE_FIELDS.map((f) => {
            const checked = entry.scorecard?.[f.key];
            return (
              <button key={f.key} onClick={() => toggleScore(dayNum, f.key)}
                style={{ background: checked ? "rgba(180,137,79,0.15)" : COLORS.inkRaised, border: `1px solid ${checked ? COLORS.brass : COLORS.inkLine}`, color: checked ? COLORS.brassBright : COLORS.slate }}
                className="flex items-center gap-2 rounded-md px-3 py-2.5 text-sm font-medium transition">
                {checked ? <Check size={13} /> : <Circle size={13} />}
                {f.label}
              </button>
            );
          })}
        </div>
      </Section>

      <Section title="Where did I notice God today?">
        <textarea value={notice} onChange={(e) => { setNotice(e.target.value); updateDay(dayNum, { noticedGod: e.target.value }); }} rows={2}
          style={{ background: COLORS.parchment, color: COLORS.parchmentText, border: `1px solid ${COLORS.inkLine}` }}
          className="w-full rounded-md p-3 text-base leading-relaxed resize-none focus:outline-none focus:ring-1" placeholder="…" />
      </Section>

      <Section title="What needs correction tomorrow?">
        <textarea value={correction} onChange={(e) => { setCorrection(e.target.value); updateDay(dayNum, { correction: e.target.value }); }} rows={2}
          style={{ background: COLORS.parchment, color: COLORS.parchmentText, border: `1px solid ${COLORS.inkLine}` }}
          className="w-full rounded-md p-3 text-base leading-relaxed resize-none focus:outline-none focus:ring-1" placeholder="…" />
      </Section>

      <div style={{ color: COLORS.slateDim, fontFamily: "'IBM Plex Mono', monospace" }} className="h-4 text-center text-[12px] mb-6 tracking-wider">
        {saveState === "saving" ? "SAVING…" : saveState === "saved" ? "SAVED" : ""}
      </div>

      <div className="flex items-center justify-between gap-3">
        <button onClick={() => goTo(dayNum - 1)} disabled={dayNum <= 1} style={{ border: `1px solid ${COLORS.inkLine}`, color: COLORS.slate, opacity: dayNum <= 1 ? 0.3 : 1 }} className="flex-1 rounded-lg py-3 text-sm font-medium flex items-center justify-center gap-1">
          <ChevronLeft size={14} /> Day {dayNum - 1}
        </button>
        <button onClick={() => goTo(dayNum + 1)} disabled={dayNum >= 90} style={{ background: COLORS.brass, color: COLORS.ink, opacity: dayNum >= 90 ? 0.3 : 1 }} className="flex-1 rounded-lg py-3 text-sm font-semibold flex items-center justify-center gap-1">
          Day {dayNum + 1} <ChevronRight size={14} />
        </button>
      </div>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div className="mb-8">
      <h3 style={{ color: COLORS.brass, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[13px] uppercase tracking-widest mb-3">{title}</h3>
      {children}
    </div>
  );
}

function ReflectField({ label, value, onChange }) {
  return (
    <div className="mb-3">
      <p style={{ color: "#C9CDD4" }} className="text-base mb-1.5 leading-snug">{label}</p>
      <textarea value={value} onChange={(e) => onChange(e.target.value)} rows={2}
        style={{ background: COLORS.parchment, color: COLORS.parchmentText, border: `1px solid ${COLORS.inkLine}` }}
        className="w-full rounded-md p-3 text-base leading-relaxed resize-none focus:outline-none focus:ring-1" placeholder="…" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

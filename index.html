<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const DAYS = [{"day": 1, "title": "Chosen Before Achieving", "read": "Ephesians 1:3-5", "keyTruth": "Your deepest identity is received from God, not earned through performance.", "body": "Business wins, physique progress, and recognition can be enjoyed without becoming the source of your worth. Begin today from acceptance rather than striving for it. Your deepest identity is received from God, not earned through performance. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where have I been using achievement to prove my value?", "How would I work differently today if I already knew I was secure?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Your deepest identity is received from God, not earned through performance. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Before checking your phone, say aloud: 'I am loved by God before I produce anything today.'", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 2, "title": "A New Creation", "read": "2 Corinthians 5:17", "keyTruth": "In Christ, your past patterns are real history but they are not your permanent identity.", "body": "Do not describe yourself by the habits you are trying to leave. Speak honestly about weakness while agreeing with what God is forming in you. In Christ, your past patterns are real history but they are not your permanent identity. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What old label do I keep carrying?", "What evidence of new life can I thank God for?"], "pray": "Father, thank You that You are present in the ordinary details of my life. In Christ, your past patterns are real history but they are not your permanent identity. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Replace one limiting identity statement with a truthful one rooted in Scripture.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 3, "title": "Abide Before You Build", "read": "John 15:4-5", "keyTruth": "Fruitfulness flows from abiding in Christ, not merely from working harder.", "body": "You can build funnels, close sales, lead a household, and still run spiritually dry. Connection with Christ is not another task; it is the source that gives every task life. Fruitfulness flows from abiding in Christ, not merely from working harder. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What am I trying to produce without abiding?", "What would dependence on Christ look like today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Fruitfulness flows from abiding in Christ, not merely from working harder. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Spend five quiet minutes with no request---only attention, gratitude, and surrender.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 4, "title": "The Same Man Everywhere", "read": "Daniel 1:8", "keyTruth": "Conviction becomes character when it travels with you into every environment.", "body": "Home, travel, restaurants, family gatherings, and stressful days do not need separate moral identities. The menu and schedule may change; your stewardship can remain intact. Conviction becomes character when it travels with you into every environment. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where does my discipline usually stay behind?", "What decision can I make in advance?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Conviction becomes character when it travels with you into every environment. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Identify today's highest-risk environment and decide your response before entering it.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 5, "title": "No Condemnation", "read": "Romans 8:1-2", "keyTruth": "Conviction leads you back to God; condemnation tells you to hide from Him.", "body": "A missed target should create honest correction, not self-hatred. Grace does not excuse drift; it gives you the safety to face it truthfully and return quickly. Conviction leads you back to God; condemnation tells you to hide from Him. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Do I respond to failure with repentance or shame?", "What is the next faithful action?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Conviction leads you back to God; condemnation tells you to hide from Him. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Correct one mistake today without insulting yourself.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 6, "title": "Mind Set on the Spirit", "read": "Romans 8:5-6", "keyTruth": "Repeated attention shapes desire, direction, and identity.", "body": "What you rehearse mentally will eventually influence what you choose physically. Feed your mind with truth before advertisements, appetites, and anxieties set the agenda. Repeated attention shapes desire, direction, and identity. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What receives the first attention of my day?", "Which thought pattern needs replacement?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Repeated attention shapes desire, direction, and identity. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Memorize one sentence from today's passage and repeat it at three transition points.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 7, "title": "Hidden With Christ", "read": "Colossians 3:1-4", "keyTruth": "Your life is anchored in Christ even when visible results are slow.", "body": "Progress may be hidden in quiet choices: closing the app, stopping at one plate, making the call, apologizing first, or resting when instructed. God sees hidden obedience. Your life is anchored in Christ even when visible results are slow. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Am I faithful when nobody applauds?", "What hidden obedience is God inviting today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Your life is anchored in Christ even when visible results are slow. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Complete one quiet act of obedience without telling anyone.", "week": 1, "weekTitle": "Identity in Christ"}, {"day": 8, "title": "Everything Belongs to God", "read": "Psalm 24:1", "keyTruth": "Ownership is temporary; stewardship is your present assignment.", "body": "Your body, money, business opportunities, home, marriage, children, and time are entrusted to you. Ask not only what you want from them, but what faithfulness requires of you. Ownership is temporary; stewardship is your present assignment. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What do I treat as though it belongs only to me?", "What would faithful management look like?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Ownership is temporary; stewardship is your present assignment. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Write the words 'God's property' beside the area you are most tempted to control.", "week": 2, "weekTitle": "Stewardship"}, {"day": 9, "title": "Faithful With Little", "read": "Luke 16:10", "keyTruth": "Small choices reveal readiness for larger responsibility.", "body": "The ignored follow-up, untracked meal, delayed apology, or unnecessary purchase may appear small. Yet small habits become the operating system of larger assignments. Small choices reveal readiness for larger responsibility. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Which small thing keeps exposing inconsistency?", "What larger trust could this habit be preparing me for?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Small choices reveal readiness for larger responsibility. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Finish one small responsibility you have repeatedly postponed.", "week": 2, "weekTitle": "Stewardship"}, {"day": 10, "title": "Number Your Days", "read": "Psalm 90:12", "keyTruth": "Time becomes wise when you remember it is limited.", "body": "A full calendar is not automatically a faithful life. Wisdom distinguishes urgency from importance and activity from assignment. Time becomes wise when you remember it is limited. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where is my time leaking?", "What deserves my best energy today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Time becomes wise when you remember it is limited. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Choose three priorities for today and deliberately release one nonessential task.", "week": 2, "weekTitle": "Stewardship"}, {"day": 11, "title": "Stewarding the Body", "read": "1 Corinthians 6:19-20", "keyTruth": "Your body is neither an idol nor an inconvenience; it is a temple and instrument.", "body": "Fitness, food, sleep, medication, and recovery can all become worship when governed by gratitude and wisdom. Stewardship adapts to the season without abandoning the principle. Your body is neither an idol nor an inconvenience; it is a temple and instrument. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Am I caring for my body from love or punishment?", "What does wise stewardship require today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Your body is neither an idol nor an inconvenience; it is a temple and instrument. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Do the healthiest action currently approved for your season.", "week": 2, "weekTitle": "Stewardship"}, {"day": 12, "title": "Stewarding Attention", "read": "Proverbs 4:25-27", "keyTruth": "Attention is one of your most valuable and frequently stolen resources.", "body": "What repeatedly captures your eyes will influence your thoughts, emotions, and decisions. Guarding attention is essential for prayer, marriage, parenting, and focused work. Attention is one of your most valuable and frequently stolen resources. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What has been fragmenting my attention?", "Who deserves my undivided presence today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Attention is one of your most valuable and frequently stolen resources. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Create one phone-free block of at least thirty minutes.", "week": 2, "weekTitle": "Stewardship"}, {"day": 13, "title": "Open Hands", "read": "1 Timothy 6:17-19", "keyTruth": "Resources are safest when held with gratitude, humility, and generosity.", "body": "God may increase your resources, but increase should enlarge your usefulness---not your pride. Wealth is a tool for provision, opportunity, generosity, and Kingdom service. Resources are safest when held with gratitude, humility, and generosity. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Would increased wealth make me more useful or merely more", "Where can I practice open-handedness now?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Resources are safest when held with gratitude, humility, and generosity. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Give something today---money, time, access, encouragement, or knowledge.", "week": 2, "weekTitle": "Stewardship"}, {"day": 14, "title": "An Account to Give", "read": "Romans 14:12", "keyTruth": "Stewardship becomes serious when you remember every life answers to God.", "body": "You are not ultimately competing with another entrepreneur, father, or believer. Your question is whether you were faithful with your own assignment. Stewardship becomes serious when you remember every life answers to God. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where am I comparing instead of stewarding?", "What will I be glad to have obeyed?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Stewardship becomes serious when you remember every life answers to God. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Review this week and name one area needing honest course correction.", "week": 2, "weekTitle": "Stewardship"}, {"day": 15, "title": "Train for Godliness", "read": "1 Timothy 4:7-8", "keyTruth": "Godliness grows through intentional training, not accidental desire.", "body": "Spiritual discipline and physical discipline share a principle: repeated practice makes faithful action more available under pressure. Training does not earn grace; it helps you respond to grace. Godliness grows through intentional training, not accidental desire. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where am I relying on motivation?", "What simple system would support obedience?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Godliness grows through intentional training, not accidental desire. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Choose one habit and make the first step easier before the day begins.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 16, "title": "Rule Your Spirit", "read": "Proverbs 16:32", "keyTruth": "Self-mastery is a greater victory than outward domination.", "body": "Closing a deal may impress people, but governing anger, appetite, pride, and distraction demonstrates deeper strength. The strongest man is not controlled by every impulse. Self-mastery is a greater victory than outward domination. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Which impulse most often rules me?", "What would Spirit-led restraint look like?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Self-mastery is a greater victory than outward domination. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Pause for sixty seconds before responding to your strongest urge today.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 17, "title": "Make No Provision", "read": "Romans 13:14", "keyTruth": "Wisdom does not repeatedly place the flesh in ideal conditions to win.", "body": "Do not call avoidable temptation a willpower test. Prepare food, remove distractions, schedule movement, and establish boundaries before appetite becomes urgent. Wisdom does not repeatedly place the flesh in ideal conditions to win. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where am I making obedience unnecessarily difficult?", "What can I prepare in advance?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Wisdom does not repeatedly place the flesh in ideal conditions to win. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Remove one predictable source of temptation from today's environment.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 18, "title": "Decide Before Desire", "read": "Daniel 1:8", "keyTruth": "Pre-decisions protect conviction when emotions become loud.", "body": "At the buffet, on vacation, or after a long workday, the moment of choice is often too late to create a standard. Decide beforehand what faithfulness looks like. Pre-decisions protect conviction when emotions become loud. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Which decisions become unstable when I am tired?", "What standard can I settle now?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Pre-decisions protect conviction when emotions become loud. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Write your plan for today's meals, work block, and family time before noon.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 19, "title": "The Grace to Say No", "read": "Titus 2:11-12", "keyTruth": "Grace trains believers to refuse ungodly and unwise desires.", "body": "Grace is not merely forgiveness after failure. It is power and instruction before the decision. Every wise no protects a more important yes. Grace trains believers to refuse ungodly and unwise desires. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What future yes requires a no today?", "Where have I confused grace with permission?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Grace trains believers to refuse ungodly and unwise desires. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Say no to one immediate comfort so you can honor a higher priority.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 20, "title": "Return Quickly", "read": "Proverbs 24:16", "keyTruth": "Resilience is measured by how faithfully and quickly you rise.", "body": "One missed meal target, workout, call block, or relational moment does not need to become a lost week. The next decision is always available. Resilience is measured by how faithfully and quickly you rise. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where do I allow one mistake to multiply?", "What does immediate recovery look like?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Resilience is measured by how faithfully and quickly you rise. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Use the next opportunity---not tomorrow---to return to your standard.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 21, "title": "Endure the Repetition", "read": "Galatians 6:9", "keyTruth": "Harvest requires doing good long after novelty disappears.", "body": "Most meaningful results come through ordinary repetition: prayer, protein, movement, follow-up, budgeting, listening, and showing up. Boredom is not evidence that the process is broken. Harvest requires doing good long after novelty disappears. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Which good practice feels boring right now?", "What harvest could steady repetition produce?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Harvest requires doing good long after novelty disappears. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Complete today's fundamentals without changing the plan for excitement.", "week": 3, "weekTitle": "Discipline and Self-Control"}, {"day": 22, "title": "Covenant Before Convenience", "read": "Malachi 2:14-15", "keyTruth": "Marriage is a covenant to protect, not a convenience to consume.", "body": "Your wife is not simply a partner in logistics. She is the woman with whom you made promises before God. Protecting the covenant means prioritizing trust, presence, truth, and tenderness. Marriage is a covenant to protect, not a convenience to consume. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Where has convenience replaced intentional love?", "What would covenant faithfulness look like today?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Marriage is a covenant to protect, not a convenience to consume. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Do one action today that communicates, 'You are not competing with my work.'", "week": 4, "weekTitle": "Covenant Marriage"}, {"day": 23, "title": "Love Sacrificially", "read": "Ephesians 5:25", "keyTruth": "Biblical love gives itself for another person's good.", "body": "Sacrifice is not always dramatic. It may look like listening when tired, carrying a burden, changing a schedule, or serving without being asked. Biblical love gives itself for another person's good. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What cost am I resisting in love?", "How can I serve without keeping score?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Biblical love gives itself for another person's good. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Ask your wife what would make today lighter for her, then do one thing.", "week": 4, "weekTitle": "Covenant Marriage"}, {"day": 24, "title": "Listen Before Solving", "read": "James 1:19", "keyTruth": "Being quick to hear is often more loving than being quick to fix.", "body": "A builder naturally searches for solutions. Yet your wife may first need to feel understood. Listening communicates that her inner world matters. Being quick to hear is often more loving than being quick to fix. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["Do I listen to understand or prepare my defense?", "What emotion might be underneath her words?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Being quick to hear is often more loving than being quick to fix. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Give your wife ten uninterrupted minutes and ask one follow-up question before offering advice.", "week": 4, "weekTitle": "Covenant Marriage"}, {"day": 25, "title": "Gentle Strength", "read": "Colossians 3:19", "keyTruth": "Strength in marriage should create safety, not harshness.", "body": "Harsh words can accomplish immediate compliance while quietly damaging trust. Gentleness is not weakness; it is controlled strength shaped by love. Strength in marriage should create safety, not harshness. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["What triggers harshness in me?", "How would Christlike strength respond?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Strength in marriage should create safety, not harshness. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Lower your volume and soften your first response during the next tense moment.", "week": 4, "weekTitle": "Covenant Marriage"}, {"day": 26, "title": "Protect the Friendship", "read": "Proverbs 5:18", "keyTruth": "Marriage needs delight, friendship, and shared joy---not only responsibility.", "body": "A household can become efficient while the marriage becomes emotionally thin. Continue learning, laughing, dating, and enjoying one another. Marriage needs delight, friendship, and shared joy---not only responsibility. This does not mean you will perform perfectly today. It means you can remain honest, responsive, and anchored in Christ. When pressure, appetite, fear, fatigue, or opportunity speaks loudly, pause long enough to remember what has already been entrusted to you. Faithfulness is rarely one dramatic act; it is usually the next right decision made in the presence of God.", "reflect": ["When did we last enjoy each other without an agenda?", "What does my wife enjoy that I can enter with her?"], "pray": "Father, thank You that You are present in the ordinary details of my life. Marriage needs delight, friendship, and shared joy---not only responsibility. Give me wisdom to recognize today's assignment, courage to obey it, and grace to return quickly wherever I drift. Let my body, work, marriage, fatherhood, resources, and influence come under Your rule. In Jesus' name, amen.", "action": "Plan one simple connection point that does not revolve around solving a problem.", "week": 4, "weekTitle": "Covenant Marriage"}, {"day": 27, "title": "Faithful in Intimacy", "read": "1 Corinthians 7:3-5", "keyTruth": "Marital intimacy i
